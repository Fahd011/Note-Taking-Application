name: Deploy MERN App

on:
  push:
    branches:
      - production
  pull_request:
    branches:
      - production

jobs:
  # Step 21 Build and Push Docker Image
  build-and-push-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/mern-server:latest ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/mern-server:latest

  # Step 3: Deploy to EC2 Instance
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push-docker
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Stop and remove any existing container
            docker-compose down || true

            # Pull the latest Docker image
            docker-compose pull

            # Recreate .env file
            echo "DB_URL=${{ secrets.DB_URL }}" > .env

            # Start the app
            docker-compose up -d
