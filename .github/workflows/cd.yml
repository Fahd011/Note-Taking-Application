name: Deploy MERN App

on:
  push:
    branches:
      - production
  pull_request:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Set environment variables for the job, these will be available for all steps
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      API_KEY: ${{ secrets.API_KEY }}

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set Up AWS CLI
      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      # Step 3: Fetch Target Instance IP
      - name: Get Target Instance (Green)
        id: green_instance_ip
        run: |
          GREEN_INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Environment,Values=Green" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          GREEN_INSTANCE_IP=$(aws ec2 describe-instances \
            --instance-ids $GREEN_INSTANCE_ID \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          echo "GREEN_INSTANCE_IP=$GREEN_INSTANCE_IP" >> $GITHUB_ENV

      # Step 4: Deploy Backend and Frontend
      - name: Deploy to EC2
        run: |
          scp -o StrictHostKeyChecking=no -r -i ${{ secrets.SSH_KEY }} \
              ./backend ./frontend ./docker-compose.yml \
              ec2-user@$GREEN_INSTANCE_IP:/home/ec2-user/

          ssh -o StrictHostKeyChecking=no -i ${{ secrets.SSH_KEY }} ec2-user@$GREEN_INSTANCE_IP << EOF
              cd /home/ec2-user/
              export MONGO_URI=${{ secrets.MONGO_URI }}
              export JWT_SECRET=${{ secrets.JWT_SECRET }}
              export API_KEY=${{ secrets.API_KEY }}
              docker-compose down || true
              docker-compose up -d --build
          EOF

      # Step 5: Update Load Balancer (Switch from Blue to Green)
      - name: Switch Load Balancer
        run: |
          GREEN_INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Environment,Values=Green" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          aws elb register-instances-with-load-balancer \
            --load-balancer-name mern-load-balancer \
            --instances $GREEN_INSTANCE_ID
