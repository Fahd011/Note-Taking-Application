name: Deploy MERN App

on:
  push:
    branches:
      - production
  pull_request:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      API_KEY: ${{ secrets.API_KEY }}

    steps:
      # Step 1: Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Step 2: Set Up AWS CLI
      - name: Configure AWS CLI
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      # Step 3: Fetch Target Instance IP
      - name: Get Target Instance (Green)
        id: green_instance_ip
        run: |
          GREEN_INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Environment,Values=Green" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          GREEN_INSTANCE_IP=$(aws ec2 describe-instances \
            --instance-ids $GREEN_INSTANCE_ID \
            --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          echo "GREEN_INSTANCE_IP=$GREEN_INSTANCE_IP" >> $GITHUB_ENV

      # Step 4: Set Up SSH Key
      - name: Set Up SSH Key
        run: |
          echo "${{ secrets.SSH_KEY }}" > ssh_key.pem
          chmod 600 ssh_key.pem

      # Step 5: Deploy to EC2 using Git
      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ssh_key.pem ec2-user@$GREEN_INSTANCE_IP << EOF
              # Ensure the necessary directory exists and pull the latest changes
              if [ ! -d "/home/ec2-user/Note-Taking-Application" ]; then
                  git clone https://github.com/Fahd011/Note-Taking-Application.git /home/ec2-user/Note-Taking-Application
              fi
              
              cd /home/ec2-user/Note-Taking-Application
              
              # Reset and fetch the latest changes from the production branch
              git reset --hard
              git clean -fd
              git fetch origin production
              git checkout production
              git pull origin production
              
              # Set environment variables
              export MONGO_URI=${{ secrets.MONGO_URI }}
              export JWT_SECRET=${{ secrets.JWT_SECRET }}

              # Restart the application using Docker Compose
              docker-compose down || true
              docker-compose up -d --build
          EOF

      # Step 6: Update Load Balancer (Switch from Blue to Green)
      - name: Switch Load Balancer
        run: |
          GREEN_INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Environment,Values=Green" "Name=instance-state-name,Values=running" \
            --query "Reservations[0].Instances[0].InstanceId" --output text)
          aws elb register-instances-with-load-balancer
